<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Katha Pawale — AI Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0614"/><stop offset="0.5" stop-color="#1a1033"/><stop offset="1" stop-color="#0b0614"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <!-- floating orbs -->
  <circle cx="1040" cy="70" r="90" fill="#7c3aed" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cy" values="70;95;70" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="250" r="70" fill="#3b82f6" opacity="0.16" filter="url(#glow)">
    <animate attributeName="cx" values="130;160;130" dur="9s" repeatCount="indefinite"/>
  </circle>
  <!-- left accent bar -->
  <rect x="70" y="86" width="6" height="128" rx="3" fill="url(#name)"/>
  <!-- name -->
  <text x="100" y="136" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#name)" letter-spacing="-1">Katha Pawale</text>
  <!-- role -->
  <text x="102" y="178" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#e9e3ff">AI Full-Stack Developer</text>
  <!-- rotating lines -->
  <g font-family="Menlo, Consolas, monospace" font-size="17" fill="#a78bfa">
    <text x="102" y="212" opacity="0">&gt; React · Next.js · Node.js · TypeScript · Supabase
      <animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0;0.05;0.3;0.34;0.66;0.95;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="102" y="212" opacity="0">&gt; auth systems · REST APIs · real-time data · responsive UI
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.34;0.38;0.42;0.62;0.66;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="102" y="212" opacity="0">&gt; building AI agents &amp; automation workflows with Claude and GPT
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.66;0.70;0.74;0.95;0.99;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <!-- location chip -->
  <rect x="890" y="214" width="230" height="36" rx="18" fill="#1e1538" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="1005" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c4b5fd">📍 Vadodara, Gujarat, India</text>
  <!-- animated underline -->
  <rect x="0" y="292" width="1200" height="3" fill="url(#line)">
    <animate attributeName="x" values="-1200;1200" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
